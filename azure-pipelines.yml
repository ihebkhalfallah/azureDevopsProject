# ============================================================
# Pipeline CI - gestion-signalement
# Déclenchement : push sur main, develop, feature/*, release/*
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
      - release/*
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - develop

variables:
  # ---- Maven ------------------------------------------------
  MAVEN_OPTS: '-Xmx1024m'
  # ---- Docker Hub ------------------------------------------
  # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN à définir dans le groupe de variables "dockerhub-config"
  DOCKERHUB_REPOSITORY: '$(DOCKERHUB_USERNAME)/gestion-signalement'
  IMAGE_NAME: 'gestion-signalement'
  IMAGE_TAG: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build & Tests'
    jobs:
      - job: MavenBuild
        displayName: 'Compilation Maven + Tests unitaires'
        services:
          mysql:
            image: mysql:5.7
            env:
              MYSQL_DATABASE: signalementDb
              MYSQL_USER: admin
              MYSQL_PASSWORD: admin123
              MYSQL_ROOT_PASSWORD: root123
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping -h localhost -u admin -padmin123"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=10
              --health-start-period=30s
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Installer JDK 8'
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
          - task: Cache@2
            displayName: 'Cache dépendances Maven'
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'
          - task: Maven@3
            displayName: 'mvn clean verify (build + tests + JaCoCo)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '-Dmaven.test.failure.ignore=false'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
            env:
              # Le service MySQL est accessible sur localhost dans un job non-conteneurisé
              SPRING_DATASOURCE_URL: 'jdbc:mysql://localhost:3306/signalementDb?createDatabaseIfNotExist=true&serverTimezone=UTC'
              SPRING_DATASOURCE_USERNAME: 'admin'
              SPRING_DATASOURCE_PASSWORD: 'admin123'
              SPRING_JPA_HIBERNATE_DDL_AUTO: 'create'
          - task: PublishCodeCoverageResults@1
            displayName: 'Publier couverture JaCoCo'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '**/target/site/jacoco/jacoco.xml'
              reportDirectory: '**/target/site/jacoco'
              failIfCoverageEmpty: false
          - task: PublishBuildArtifacts@1
            displayName: 'Publier JAR'
            inputs:
              PathtoPublish: 'target/gestion-signalement.jar'
              ArtifactName: 'jar-artifact'
              publishLocation: 'Container'

  # ============================================================
  # STAGE 2 : ANALYSE DE CODE STATIQUE
  # ============================================================
  - stage: CodeAnalysis
    displayName: 'Analyse de code statique'
    dependsOn: Build
    condition: succeeded()
    jobs:

      # --- Checkstyle + SpotBugs via Maven --------------------
      - job: StaticAnalysis
        displayName: 'Checkstyle & SpotBugs'
        steps:

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Checkstyle'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'checkstyle:checkstyle'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: Maven@3
            displayName: 'SpotBugs'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'compile spotbugs:spotbugs'
              options: '-DskipTests'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: PublishBuildArtifacts@1
            displayName: 'Publier rapports SpotBugs'
            inputs:
              PathtoPublish: 'target/spotbugs'
              ArtifactName: 'spotbugs-report'
              publishLocation: 'Container'

      # --- SonarQube (via Maven, aucune extension marketplace requise) ---
      - job: SonarQube
        displayName: 'Analyse SonarQube'
        variables:
          - group: sonar-config   # Groupe de variables : SONAR_TOKEN, SONAR_HOST_URL, SONAR_PROJECT_KEY
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Installer JDK 17 (requis par sonar-maven-plugin)'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Build + SonarQube analyse (Maven)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'verify sonar:sonar'
              options: >
                -DskipTests
                -Dsonar.projectKey=$(SONAR_PROJECT_KEY)
                -Dsonar.projectName=gestion-signalement
                -Dsonar.projectVersion=$(Build.BuildNumber)
                -Dsonar.host.url=$(SONAR_HOST_URL)
                -Dsonar.login=$(SONAR_TOKEN)
                -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
                -Dsonar.java.source=1.8
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'

  # ============================================================
  # STAGE 3 : BUILD IMAGE DOCKER & PUSH Docker Hub
  #   Uniquement sur main ou develop
  # ============================================================
  - stage: DockerBuild
    displayName: 'Build & Push Image Docker'
    dependsOn: CodeAnalysis
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop')
        )
      )
    variables:
      - group: dockerhub-config   # Groupe de variables contenant DOCKERHUB_USERNAME et DOCKERHUB_TOKEN
    jobs:
      - job: Docker
        displayName: 'Build Docker et push vers Docker Hub'
        steps:

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Package JAR (skip tests)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package'
              options: '-DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: Docker@2
            displayName: 'Build & Push image vers Docker Hub'
            inputs:
              containerRegistry: 'DockerHubServiceConnection'
              repository: '$(DOCKERHUB_REPOSITORY)'
              command: 'buildAndPush'
              Dockerfile: 'Dockerfile'
              buildContext: '.'
              tags: |
                $(IMAGE_TAG)
                latest

          - task: PublishBuildArtifacts@1
            displayName: 'Publier manifests K8s (pour deploy)'
            inputs:
              PathtoPublish: 'k8s'
              ArtifactName: 'k8s-manifests'
              publishLocation: 'Container'

  # ============================================================
  # STAGE 4 : DÉPLOIEMENT SUR AKS
  #   Uniquement sur main, après DockerBuild
  #   Nécessite : variable secrète KUBECONFIG_CONTENT dans le groupe "aks-config"
  # ============================================================
  - stage: Deploy
    displayName: 'Déploiement sur AKS'
    dependsOn: DockerBuild
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    variables:
      - group: aks-config    # KUBECONFIG_CONTENT (secret), AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
      - group: db-config     # DB_URL, DB_USER, DB_PASSWORD
    jobs:
      - deployment: DeployToAKS
        displayName: 'Déployer sur AKS'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:

                - task: DownloadBuildArtifacts@1
                  displayName: 'Télécharger manifests K8s'
                  inputs:
                    buildType: 'current'
                    artifactName: 'k8s-manifests'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - task: Bash@3
                  displayName: 'Configurer kubectl'
                  inputs:
                    targetType: 'inline'
                    script: |
                      mkdir -p ~/.kube
                      echo "$(KUBECONFIG_CONTENT)" > ~/.kube/config
                      chmod 600 ~/.kube/config
                      kubectl version --client

                - task: Bash@3
                  displayName: 'Créer namespace et secret DB'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl create namespace signalement --dry-run=client -o yaml | kubectl apply -f -

                      kubectl create secret generic db-secret \
                        --namespace=signalement \
                        --from-literal=datasource-url="$(DB_URL)" \
                        --from-literal=datasource-username="$(DB_USER)" \
                        --from-literal=datasource-password="$(DB_PASSWORD)" \
                        --dry-run=client -o yaml | kubectl apply -f -

                - task: Bash@3
                  displayName: 'Déployer MySQL'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl apply -f $(System.ArtifactsDirectory)/k8s-manifests/mysql.yml
                      kubectl rollout status deployment/mysql -n signalement --timeout=120s

                - task: Bash@3
                  displayName: 'Déployer application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)
                      export IMAGE_TAG=$(Build.BuildId)
                      export SPRING_PROFILE=production

                      cat $(System.ArtifactsDirectory)/k8s-manifests/deployment.yml | \
                        envsubst | kubectl apply -f -

                      kubectl rollout status deployment/gestion-signalement \
                        -n signalement --timeout=300s

                - task: Bash@3
                  displayName: 'Smoke test'
                  inputs:
                    targetType: 'inline'
                    script: |
                      NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
                      URL="http://${NODE_IP}:30080/aec-api-rest/actuator/health"
                      echo "Test : $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "Déploiement OK (HTTP 200)"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS"
                        sleep 15
                      done
                      exit 1