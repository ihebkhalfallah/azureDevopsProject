# ============================================================
# Pipeline CI - gestion-signalement
# Déclenchement : push sur main, develop, feature/*, release/*
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
      - release/*
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - develop

variables:
  # ---- Maven ------------------------------------------------
  MAVEN_OPTS: '-Xmx1024m'
  # ---- Docker Hub ------------------------------------------
  # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN à définir dans le groupe de variables "dockerhub-config"
  DOCKERHUB_REPOSITORY: '$(DOCKERHUB_USERNAME)/gestion-signalement'
  IMAGE_NAME: 'gestion-signalement'
  IMAGE_TAG: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ============================================================
  # STAGE 1 : BUILD & TESTS
  # ============================================================
  - stage: Build
    displayName: 'Build & Tests'
    jobs:
      - job: MavenBuild
        displayName: 'Compilation Maven + Tests unitaires'
        services:
          mysql:
            image: mysql:5.7
            env:
              MYSQL_DATABASE: signalementDb
              MYSQL_USER: admin
              MYSQL_PASSWORD: admin123
              MYSQL_ROOT_PASSWORD: root123
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping -h localhost -u admin -padmin123"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=10
              --health-start-period=30s
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Installer JDK 8'
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
          - task: Cache@2
            displayName: 'Cache dépendances Maven'
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'
          - task: Maven@3
            displayName: 'mvn clean verify (build + tests + JaCoCo)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '-Dmaven.test.failure.ignore=false'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
            env:
              # Le service MySQL est accessible sur localhost dans un job non-conteneurisé
              SPRING_DATASOURCE_URL: 'jdbc:mysql://localhost:3306/signalementDb?createDatabaseIfNotExist=true&serverTimezone=UTC'
              SPRING_DATASOURCE_USERNAME: 'admin'
              SPRING_DATASOURCE_PASSWORD: 'admin123'
              SPRING_JPA_HIBERNATE_DDL_AUTO: 'create'
          - task: PublishCodeCoverageResults@1
            displayName: 'Publier couverture JaCoCo'
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: '**/target/site/jacoco/jacoco.xml'
              reportDirectory: '**/target/site/jacoco'
              failIfCoverageEmpty: false
          - task: PublishBuildArtifacts@1
            displayName: 'Publier JAR'
            inputs:
              PathtoPublish: 'target/gestion-signalement.jar'
              ArtifactName: 'jar-artifact'
              publishLocation: 'Container'

  # ============================================================
  # STAGE 2 : ANALYSE DE CODE STATIQUE
  # ============================================================
  - stage: CodeAnalysis
    displayName: 'Analyse de code statique'
    dependsOn: Build
    condition: succeeded()
    jobs:

      # --- Checkstyle + SpotBugs via Maven --------------------
      - job: StaticAnalysis
        displayName: 'Checkstyle & SpotBugs'
        steps:

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Checkstyle'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'checkstyle:checkstyle'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: Maven@3
            displayName: 'SpotBugs'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'spotbugs:spotbugs'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: PublishBuildArtifacts@1
            displayName: 'Publier rapports SpotBugs'
            inputs:
              PathtoPublish: 'target/spotbugs'
              ArtifactName: 'spotbugs-report'
              publishLocation: 'Container'

      # --- SonarQube (via Maven, aucune extension marketplace requise) ---
      - job: SonarQube
        displayName: 'Analyse SonarQube'
        variables:
          - group: sonar-config   # Groupe de variables : SONAR_TOKEN, SONAR_HOST_URL, SONAR_PROJECT_KEY
        steps:

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Build + SonarQube analyse (Maven)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'verify sonar:sonar'
              options: >
                -Dsonar.projectKey=$(SONAR_PROJECT_KEY)
                -Dsonar.projectName=gestion-signalement
                -Dsonar.projectVersion=$(Build.BuildNumber)
                -Dsonar.host.url=$(SONAR_HOST_URL)
                -Dsonar.login=$(SONAR_TOKEN)
                -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
                -Dsonar.java.source=1.8
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

  # ============================================================
  # STAGE 3 : BUILD IMAGE DOCKER & PUSH Docker Hub
  #   Uniquement sur main ou develop
  # ============================================================
  - stage: DockerBuild
    displayName: 'Build & Push Image Docker'
    dependsOn: CodeAnalysis
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop')
        )
      )
    variables:
      - group: dockerhub-config   # Groupe de variables contenant DOCKERHUB_USERNAME et DOCKERHUB_TOKEN
    jobs:
      - job: Docker
        displayName: 'Build Docker et push vers Docker Hub'
        steps:

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'

          - task: Maven@3
            displayName: 'Package JAR (skip tests)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package'
              options: '-DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'

          - task: Docker@2
            displayName: 'Build & Push image vers Docker Hub'
            inputs:
              containerRegistry: 'DockerHubServiceConnection'   # Connexion de service Docker Hub dans Azure DevOps
              repository: '$(DOCKERHUB_REPOSITORY)'
              command: 'buildAndPush'
              Dockerfile: 'Dockerfile'
              buildContext: '.'
              tags: |
                $(IMAGE_TAG)
                latest
