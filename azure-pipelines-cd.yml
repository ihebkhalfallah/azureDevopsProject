# ============================================================
# Pipeline CD - gestion-signalement
# Déploiement sur Kubernetes (kubeadm - 2 VMs Azure)
# Déclenchement : après succès du pipeline CI sur main ou develop
# ============================================================

trigger: none

resources:
  pipelines:
    - pipeline: ci-pipeline
      source: 'gestion-signalement-CI'
      trigger:
        branches:
          include:
            - main
            - develop

variables:
  # ---- Docker Hub ------------------------------------------
  DOCKERHUB_REPOSITORY: '$(DOCKERHUB_USERNAME)/gestion-signalement'
  IMAGE_TAG: '$(resources.pipeline.ci-pipeline.runID)'
  # ---- Kubernetes / AKS -----------------------------------
  # AKS_RESOURCE_GROUP et AKS_CLUSTER_NAME définis dans le groupe "aks-config"
  K8S_NAMESPACE_STAGING: 'signalement-staging'
  K8S_NAMESPACE_PROD: 'signalement'

stages:

  # ============================================================
  # STAGE 1 : DÉPLOIEMENT EN STAGING (develop → staging)
  # ============================================================
  - stage: DeployStaging
    displayName: 'Déploiement Staging (K8s)'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/develop')
    variables:
      - group: aks-config         # contient AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
      - group: dockerhub-config  # contient DOCKERHUB_USERNAME
      - group: db-config-staging # contient DB_URL_STAGING, DB_USER_STAGING, DB_PASSWORD_STAGING
      SPRING_PROFILE: 'staging'
    jobs:
      - deployment: DeployToStaging
        displayName: 'Déployer sur K8s Staging'
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: 'Configurer kubectl (AKS)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER_NAME) \
                        --overwrite-existing
                      kubectl version --client

                - task: Bash@3
                  displayName: 'Créer namespace et secret DB (staging)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl create namespace $(K8S_NAMESPACE_STAGING) --dry-run=client -o yaml | kubectl apply -f -

                      kubectl create secret generic db-secret \
                        --namespace=$(K8S_NAMESPACE_STAGING) \
                        --from-literal=datasource-url="$(DB_URL_STAGING)" \
                        --from-literal=datasource-username="$(DB_USER_STAGING)" \
                        --from-literal=datasource-password="$(DB_PASSWORD_STAGING)" \
                        --dry-run=client -o yaml | kubectl apply -f -

                - task: Bash@3
                  displayName: 'Déployer MySQL sur K8s (staging)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      sed "s/namespace: signalement/namespace: $(K8S_NAMESPACE_STAGING)/g" \
                        $(Pipeline.Workspace)/ci-pipeline/drop/k8s/mysql.yml | \
                        kubectl apply -f -

                      echo "Attente que MySQL soit ready..."
                      kubectl rollout status deployment/mysql -n $(K8S_NAMESPACE_STAGING) --timeout=120s

                - task: Bash@3
                  displayName: 'Déployer application (staging)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)
                      export IMAGE_TAG=$(IMAGE_TAG)
                      export SPRING_PROFILE=$(SPRING_PROFILE)

                      cat $(Pipeline.Workspace)/ci-pipeline/drop/k8s/deployment.yml | \
                        envsubst | \
                        sed "s/namespace: signalement/namespace: $(K8S_NAMESPACE_STAGING)/g" | \
                        kubectl apply -f -

                      kubectl rollout status deployment/gestion-signalement \
                        -n $(K8S_NAMESPACE_STAGING) --timeout=180s

                - task: Bash@3
                  displayName: 'Smoke test staging'
                  inputs:
                    targetType: 'inline'
                    script: |
                      NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
                      URL="http://${NODE_IP}:30080/aec-api-rest/actuator/health"
                      echo "Test : $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "Staging OK (HTTP 200)"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS"
                        sleep 15
                      done
                      exit 1

  # ============================================================
  # STAGE 2 : DÉPLOIEMENT EN PRODUCTION (main → prod)
  #           Requiert une approbation manuelle
  # ============================================================
  - stage: DeployProduction
    displayName: 'Déploiement Production (K8s)'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/main')
    variables:
      - group: aks-config        # contient AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
      - group: dockerhub-config # contient DOCKERHUB_USERNAME
      - group: db-config-prod   # contient DB_URL_PROD, DB_USER_PROD, DB_PASSWORD_PROD
      SPRING_PROFILE: 'production'
    jobs:
      - deployment: DeployToProduction
        displayName: 'Déployer sur K8s Production'
        environment: 'production'   # Approbation manuelle configurée sur cet environnement
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: 'Configurer kubectl (AKS)'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER_NAME) \
                        --overwrite-existing
                      kubectl version --client

                - task: Bash@3
                  displayName: 'Créer namespace et secret DB (production)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl create namespace $(K8S_NAMESPACE_PROD) --dry-run=client -o yaml | kubectl apply -f -

                      kubectl create secret generic db-secret \
                        --namespace=$(K8S_NAMESPACE_PROD) \
                        --from-literal=datasource-url="$(DB_URL_PROD)" \
                        --from-literal=datasource-username="$(DB_USER_PROD)" \
                        --from-literal=datasource-password="$(DB_PASSWORD_PROD)" \
                        --dry-run=client -o yaml | kubectl apply -f -

                - task: Bash@3
                  displayName: 'Déployer MySQL sur K8s (production)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      kubectl apply -f $(Pipeline.Workspace)/ci-pipeline/drop/k8s/mysql.yml
                      kubectl rollout status deployment/mysql -n $(K8S_NAMESPACE_PROD) --timeout=120s

                - task: Bash@3
                  displayName: 'Rolling update application (production)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)
                      export IMAGE_TAG=$(IMAGE_TAG)
                      export SPRING_PROFILE=$(SPRING_PROFILE)

                      cat $(Pipeline.Workspace)/ci-pipeline/drop/k8s/deployment.yml | \
                        envsubst | kubectl apply -f -

                      kubectl rollout status deployment/gestion-signalement \
                        -n $(K8S_NAMESPACE_PROD) --timeout=300s

                - task: Bash@3
                  displayName: 'Smoke test production'
                  inputs:
                    targetType: 'inline'
                    script: |
                      NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
                      URL="http://${NODE_IP}:30080/aec-api-rest/actuator/health"
                      echo "Test : $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "Production OK (HTTP 200)"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS"
                        sleep 15
                      done
                      exit 1

stages:

  # ============================================================
  # STAGE 1 : DÉPLOIEMENT EN STAGING (develop → staging)
  # ============================================================
  - stage: DeployStaging
    displayName: 'Déploiement Staging'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/develop')
    variables:
      IMAGE_TAG: '$(resources.pipeline.ci-pipeline.runID)'
      ENV_NAME: 'staging'
    jobs:
      - deployment: DeployToStaging
        displayName: 'Déployer sur App Service Staging'
        environment: 'staging'   # Environnement Azure DevOps (crée des approbations si besoin)
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureWebAppContainer@1
                  displayName: 'Déployer conteneur sur App Service (staging)'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    appName: '$(APP_SERVICE_NAME_STAGING)'
                    containers: 'docker.io/$(DOCKERHUB_REPOSITORY):$(IMAGE_TAG)'
                    appSettings: |
                      -SPRING_DATASOURCE_URL "$(SPRING_DATASOURCE_URL_STAGING)"
                      -SPRING_DATASOURCE_USERNAME "$(DB_USER_STAGING)"
                      -SPRING_DATASOURCE_PASSWORD "$(DB_PASSWORD_STAGING)"
                      -SPRING_JPA_HIBERNATE_DDL_AUTO "validate"
                      -SERVER_PORT "8080"
                      -SPRING_PROFILES_ACTIVE "staging"

                - task: AzureAppServiceManage@0
                  displayName: 'Redémarrer App Service staging'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    Action: 'Restart Azure App Service'
                    WebAppName: '$(APP_SERVICE_NAME_STAGING)'

                - task: AzureCLI@2
                  displayName: 'Smoke test - vérifier /aec-api-rest/actuator/health'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_STAGING).azurewebsites.net/aec-api-rest/actuator/health"
                      echo "Test de disponibilité : $URL"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then
                          echo "L'application répond (HTTP 200)"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS, nouvel essai dans 15s..."
                        sleep 15
                      done
                      echo "L'application ne répond pas après 10 tentatives"
                      exit 1

  # ============================================================
  # STAGE 2 : DÉPLOIEMENT EN PRODUCTION (main → prod)
  #           Requiert une approbation manuelle
  # ============================================================
  - stage: DeployProduction
    displayName: 'Déploiement Production'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/main')
    variables:
      IMAGE_TAG: '$(resources.pipeline.ci-pipeline.runID)'
      ENV_NAME: 'production'
    jobs:
      - deployment: DeployToProduction
        displayName: 'Déployer sur App Service Production'
        environment: 'production'   # Configurer une approbation obligatoire dans cet environnement
        strategy:
          runOnce:
            deploy:
              steps:

                # Slot swap : déployer d'abord dans le slot "staging" de l'App Service prod
                - task: AzureWebAppContainer@1
                  displayName: 'Déployer image dans slot staging de prod'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    appName: '$(APP_SERVICE_NAME_PROD)'
                    deployToSlotOrASE: true
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    slotName: 'staging'
                    containers: 'docker.io/$(DOCKERHUB_REPOSITORY):$(IMAGE_TAG)'
                    appSettings: |
                      -SPRING_DATASOURCE_URL "$(SPRING_DATASOURCE_URL_PROD)"
                      -SPRING_DATASOURCE_USERNAME "$(DB_USER_PROD)"
                      -SPRING_DATASOURCE_PASSWORD "$(DB_PASSWORD_PROD)"
                      -SPRING_JPA_HIBERNATE_DDL_AUTO "validate"
                      -SERVER_PORT "8080"
                      -SPRING_PROFILES_ACTIVE "production"

                - task: AzureCLI@2
                  displayName: 'Smoke test slot staging prod'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_PROD)-staging.azurewebsites.net/aec-api-rest/actuator/health"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then echo "OK"; exit 0; fi
                        sleep 15
                      done
                      exit 1

                # Basculement slot staging → production (zero-downtime)
                - task: AzureAppServiceManage@0
                  displayName: 'Swap slot staging → production (zero-downtime)'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    Action: 'Swap Slots'
                    WebAppName: '$(APP_SERVICE_NAME_PROD)'
                    ResourceGroupName: '$(RESOURCE_GROUP)'
                    SourceSlot: 'staging'
                    SwapWithProduction: true

                - task: AzureCLI@2
                  displayName: 'Smoke test production final'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_PROD).azurewebsites.net/aec-api-rest/actuator/health"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then echo "Production OK"; exit 0; fi
                        sleep 15
                      done
                      exit 1
