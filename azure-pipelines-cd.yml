# ============================================================
# Pipeline CD - gestion-signalement
# Déploiement sur Azure App Service (Web App for Containers)
# Déclenchement : après succès du pipeline CI sur main ou develop
# ============================================================

trigger: none   # Déclenché uniquement par le pipeline CI (ressource ci-dessous)

resources:
  pipelines:
    - pipeline: ci-pipeline
      source: 'gestion-signalement-CI'   # Nom du pipeline CI dans Azure DevOps
      trigger:
        branches:
          include:
            - main
            - develop

variables:
  # ---- Docker Hub ------------------------------------------
  # DOCKERHUB_USERNAME défini dans le groupe de variables "dockerhub-config"
  DOCKERHUB_REPOSITORY: '$(DOCKERHUB_USERNAME)/gestion-signalement'
  IMAGE_NAME: 'gestion-signalement'
  # ---- Azure App Service -----------------------------------
  AZURE_SUBSCRIPTION: 'AzureServiceConnection'  # Connexion de service Azure à créer
  RESOURCE_GROUP: 'rg-gestion-signalement'
  APP_SERVICE_NAME_STAGING: 'app-signalement-staging'
  APP_SERVICE_NAME_PROD: 'app-signalement-prod'

stages:

  # ============================================================
  # STAGE 1 : DÉPLOIEMENT EN STAGING (develop → staging)
  # ============================================================
  - stage: DeployStaging
    displayName: 'Déploiement Staging'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/develop')
    variables:
      IMAGE_TAG: '$(resources.pipeline.ci-pipeline.runID)'
      ENV_NAME: 'staging'
    jobs:
      - deployment: DeployToStaging
        displayName: 'Déployer sur App Service Staging'
        environment: 'staging'   # Environnement Azure DevOps (crée des approbations si besoin)
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureWebAppContainer@1
                  displayName: 'Déployer conteneur sur App Service (staging)'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    appName: '$(APP_SERVICE_NAME_STAGING)'
                    containers: 'docker.io/$(DOCKERHUB_REPOSITORY):$(IMAGE_TAG)'
                    appSettings: |
                      -SPRING_DATASOURCE_URL "$(SPRING_DATASOURCE_URL_STAGING)"
                      -SPRING_DATASOURCE_USERNAME "$(DB_USER_STAGING)"
                      -SPRING_DATASOURCE_PASSWORD "$(DB_PASSWORD_STAGING)"
                      -SPRING_JPA_HIBERNATE_DDL_AUTO "validate"
                      -SERVER_PORT "8080"
                      -SPRING_PROFILES_ACTIVE "staging"

                - task: AzureAppServiceManage@0
                  displayName: 'Redémarrer App Service staging'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    Action: 'Restart Azure App Service'
                    WebAppName: '$(APP_SERVICE_NAME_STAGING)'

                - task: AzureCLI@2
                  displayName: 'Smoke test - vérifier /aec-api-rest/actuator/health'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_STAGING).azurewebsites.net/aec-api-rest/actuator/health"
                      echo "Test de disponibilité : $URL"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then
                          echo "L'application répond (HTTP 200)"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS, nouvel essai dans 15s..."
                        sleep 15
                      done
                      echo "L'application ne répond pas après 10 tentatives"
                      exit 1

  # ============================================================
  # STAGE 2 : DÉPLOIEMENT EN PRODUCTION (main → prod)
  #           Requiert une approbation manuelle
  # ============================================================
  - stage: DeployProduction
    displayName: 'Déploiement Production'
    condition: eq(variables['resources.pipeline.ci-pipeline.sourceBranch'], 'refs/heads/main')
    variables:
      IMAGE_TAG: '$(resources.pipeline.ci-pipeline.runID)'
      ENV_NAME: 'production'
    jobs:
      - deployment: DeployToProduction
        displayName: 'Déployer sur App Service Production'
        environment: 'production'   # Configurer une approbation obligatoire dans cet environnement
        strategy:
          runOnce:
            deploy:
              steps:

                # Slot swap : déployer d'abord dans le slot "staging" de l'App Service prod
                - task: AzureWebAppContainer@1
                  displayName: 'Déployer image dans slot staging de prod'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    appName: '$(APP_SERVICE_NAME_PROD)'
                    deployToSlotOrASE: true
                    resourceGroupName: '$(RESOURCE_GROUP)'
                    slotName: 'staging'
                    containers: 'docker.io/$(DOCKERHUB_REPOSITORY):$(IMAGE_TAG)'
                    appSettings: |
                      -SPRING_DATASOURCE_URL "$(SPRING_DATASOURCE_URL_PROD)"
                      -SPRING_DATASOURCE_USERNAME "$(DB_USER_PROD)"
                      -SPRING_DATASOURCE_PASSWORD "$(DB_PASSWORD_PROD)"
                      -SPRING_JPA_HIBERNATE_DDL_AUTO "validate"
                      -SERVER_PORT "8080"
                      -SPRING_PROFILES_ACTIVE "production"

                - task: AzureCLI@2
                  displayName: 'Smoke test slot staging prod'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_PROD)-staging.azurewebsites.net/aec-api-rest/actuator/health"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then echo "OK"; exit 0; fi
                        sleep 15
                      done
                      exit 1

                # Basculement slot staging → production (zero-downtime)
                - task: AzureAppServiceManage@0
                  displayName: 'Swap slot staging → production (zero-downtime)'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    Action: 'Swap Slots'
                    WebAppName: '$(APP_SERVICE_NAME_PROD)'
                    ResourceGroupName: '$(RESOURCE_GROUP)'
                    SourceSlot: 'staging'
                    SwapWithProduction: true

                - task: AzureCLI@2
                  displayName: 'Smoke test production final'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      URL="https://$(APP_SERVICE_NAME_PROD).azurewebsites.net/aec-api-rest/actuator/health"
                      for i in {1..10}; do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                        if [ "$STATUS" = "200" ]; then echo "Production OK"; exit 0; fi
                        sleep 15
                      done
                      exit 1
