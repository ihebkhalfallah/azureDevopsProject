# ============================================================
# Pipeline CD - gestion-signalement
# Deploiement sur AKS via kubectl
# Declenchement : apres succes du pipeline CI sur main
# ============================================================

trigger: none

resources:
  pipelines:
    - pipeline: ci-pipeline
      source: "gestion-signalement-CI"
      trigger:
        branches:
          include:
            - main

variables:
  DOCKERHUB_REPOSITORY: "$(DOCKERHUB_USERNAME)/gestion-signalement"
  IMAGE_TAG: "$(resources.pipeline.ci-pipeline.runID)"
  K8S_NAMESPACE: "signalement"

stages:

  - stage: DeployProduction
    displayName: "Deploiement Production (AKS)"
    jobs:
      - deployment: DeployToAKS
        displayName: "Deployer sur AKS"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          - group: aks-config
          - group: dockerhub-config
          - group: db-config
        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureCLI@2
                  displayName: "Configurer kubectl (AKS)"
                  inputs:
                    azureSubscription: "AzureServiceConnection"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER_NAME) \
                        --overwrite-existing
                      kubectl version --client

                - task: Bash@3
                  displayName: "Creer namespace et secret DB"
                  inputs:
                    targetType: "inline"
                    script: |
                      kubectl create namespace $(K8S_NAMESPACE) --dry-run=client -o yaml | kubectl apply -f -
                      kubectl create secret generic db-secret \
                        --namespace=$(K8S_NAMESPACE) \
                        --from-literal=datasource-url="$(DB_URL)" \
                        --from-literal=datasource-username="$(DB_USER)" \
                        --from-literal=datasource-password="$(DB_PASSWORD)" \
                        --dry-run=client -o yaml | kubectl apply -f -

                - task: Bash@3
                  displayName: "Deployer MySQL"
                  inputs:
                    targetType: "inline"
                    script: |
                      kubectl apply -f $(Pipeline.Workspace)/ci-pipeline/drop/k8s/mysql.yml
                      kubectl rollout status deployment/mysql -n $(K8S_NAMESPACE) --timeout=120s

                - task: Bash@3
                  displayName: "Deployer application"
                  inputs:
                    targetType: "inline"
                    script: |
                      export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)
                      export IMAGE_TAG=$(IMAGE_TAG)
                      export SPRING_PROFILE=production
                      cat $(Pipeline.Workspace)/ci-pipeline/drop/k8s/deployment.yml | envsubst | kubectl apply -f -
                      kubectl rollout status deployment/gestion-signalement -n $(K8S_NAMESPACE) --timeout=300s

                - task: Bash@3
                  displayName: "Smoke test"
                  inputs:
                    targetType: "inline"
                    script: |
                      NODE_IP=$(kubectl get nodes -o jsonpath="{.items[0].status.addresses[?(@.type=="ExternalIP")].address}")
                      URL="http://${NODE_IP}:30080/aec-api-rest/actuator/health"
                      echo "Test : $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then echo "OK"; exit 0; fi
                        echo "Tentative $i/10 - HTTP $STATUS"
                        sleep 15
                      done
                      exit 1
